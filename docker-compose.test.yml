name: cogwheel-test

services:
  postgres-test:
    image: postgres:16-alpine
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: .
    image: fastapi-app-tests
    env_file:
      - .env.test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m pytest
