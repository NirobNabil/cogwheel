services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospitality
      POSTGRES_USER: hospitality
      POSTGRES_PASSWORD: hospitality
    ports:
      - "5432:5432"
    volumes:
      - hospitality_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitality -d hospitality"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: fastapi-app
    environment:
      APP_NAME: Hospitality Analytics Platform
      APP_VERSION: 0.1.0
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://hospitality:hospitality@postgres:5432/hospitality
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn infrastructure.main:app --host 0.0.0.0 --port 8000"

volumes:
  hospitality_postgres_data:
    name: hospitality_postgres_data
